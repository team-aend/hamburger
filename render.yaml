# Render QA 서버 (Blueprint): 이 파일 하나로 백엔드·프론트 두 서비스를 만든다.
#   Render 대시보드 → New → Blueprint → 이 저장소 선택 → 처음 한 번만 비밀값 입력
# 둘 다 무료(free) 플랜이라 15분 동안 접속이 없으면 잠들고, 다음 첫 접속은 1분 정도 걸린다.
# 지역은 Supabase(도쿄)와 가장 가까운 singapore. 만든 뒤에는 지역을 바꿀 수 없다.
#
# 주소는 서비스 이름대로 https://<이름>.onrender.com 이 된다.
# 이름이 이미 쓰이고 있으면 뒤에 글자가 붙으니, 그때는 아래 *.onrender.com 값들을 실제 주소로 고친다.

services:
  # ─── 백엔드 (Express) ───
  - type: web
    name: hamburger-qa-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit # main 에 push 하면 자동 배포
    envVars:
      # Supabase Transaction Pooler(포트 6543) 주소. backend/.env 의 DATABASE_URL 과 같은 값
      - key: DATABASE_URL
        sync: false
      # 로그인 쿠키 서명용. Render 가 랜덤 값(32자 이상)을 만들어 준다
      - key: SESSION_SECRET
        generateValue: true
      # 브라우저가 보는 주소 = 프론트 주소. 월드컵 요청의 Origin 검사에도 쓰인다
      - key: CORS_ORIGIN
        value: https://hamburger-qa-web.onrender.com
      # Google 로그인: GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET 는 쓸 때 대시보드에서 추가하고,
      # Google Cloud Console 의 승인된 리디렉션 URI 에 아래 주소를 등록한다
      - key: GOOGLE_REDIRECT_URI
        value: https://hamburger-qa-web.onrender.com/api/auth/google/callback
      # NODE_ENV=production(이미지 기본값)이라 개발용 로그인은 어차피 꺼진다
      - key: DEV_LOGIN
        value: "false"

  # ─── 프론트 (Next.js) ───
  - type: web
    name: hamburger-qa-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      # Render 는 환경변수를 docker build 인자로도 넘겨 준다 → 프론트 Dockerfile 의 ARG 로 들어감
      # /api/* 를 넘겨줄 백엔드 주소 (빌드할 때 이미지에 고정되니 바꾸면 다시 배포해야 함)
      - key: NEXT_PUBLIC_API_URL
        value: https://hamburger-qa-api.onrender.com
      # 공유 미리보기 이미지(og:image)의 기준 주소
      - key: NEXT_PUBLIC_SITE_URL
        value: https://hamburger-qa-web.onrender.com
